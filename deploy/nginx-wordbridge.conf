server {
    server_name wordbridge.monkeyskin.au;

    # Short timeouts for the client-facing side. This is the actual fix for
    # gunicorn's sync worker blocking the entire single-process server on a
    # slow/incomplete client connection (confirmed via py-spy in production,
    # 2026-08-22: a worker was stuck inside gunicorn's own HTTP parser,
    # waiting to read data from a client that never finished sending a
    # request). nginx is event-driven and can hold many such stalled
    # connections without blocking anything else; gunicorn's sync worker
    # cannot. Gunicorn should never be exposed directly to the internet.
    client_header_timeout 10s;
    client_body_timeout 10s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        # Slightly above gunicorn's own --timeout (120s) so nginx never cuts
        # a response off before gunicorn's own watchdog would have.
        proxy_read_timeout 130s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/wordbridge.monkeyskin.au/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/wordbridge.monkeyskin.au/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = wordbridge.monkeyskin.au) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name wordbridge.monkeyskin.au;
    return 404; # managed by Certbot
}
