<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wordbridge — High Scores</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <h1>High Scores</h1>
  <p><a href="/">Back to game</a> · <button type="button" id="clear-scores-btn">Clear high scores</button></p>

  <table id="scores-table">
    <thead>
      <tr>
        <th>Source</th>
        <th>Destination</th>
        <th>Score</th>
        <th>Date</th>
      </tr>
    </thead>
    <tbody id="scores-body"></tbody>
  </table>
  <p id="empty-message" hidden>No high scores yet — go win a game!</p>

  <script src="/scores.js"></script>
</body>
</html>
