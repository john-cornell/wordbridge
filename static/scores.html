<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wordbridge — High Scores</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="page-header">
    <h1>High Scores</h1>
    <a class="nav-link" href="/">Back to game</a>
  </header>

  <main>
    <section class="card">
      <div class="table-wrap">
        <table id="scores-table">
          <thead>
            <tr>
              <th>Player</th>
              <th>Source</th>
              <th>Destination</th>
              <th>Score</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="scores-body"></tbody>
        </table>
      </div>
      <p id="empty-message" hidden>No high scores yet — go win a game!</p>
      <button type="button" id="clear-scores-btn" class="btn btn-danger-outline">Clear high scores</button>
    </section>
  </main>

  <script src="/scores.js"></script>
</body>
</html>
