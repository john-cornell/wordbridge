<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wordbridge</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="page-header">
    <h1>Wordbridge</h1>
    <a class="nav-link" href="/scores">High scores</a>
  </header>

  <main>
    <section id="setup" class="card">
      <h2 class="card-title">Start a game</h2>
      <div class="row">
        <input id="player-name-input" class="text-input" placeholder="Your name (for high scores)" maxlength="30">
      </div>
      <button id="random-btn" class="btn btn-primary">Random pair</button>
      <div class="divider"><span>or</span></div>
      <div class="row">
        <input id="word1-input" class="text-input" placeholder="start word">
        <input id="word2-input" class="text-input" placeholder="target word">
        <button id="manual-btn" class="btn btn-outline">Use these words</button>
      </div>
    </section>

    <section id="game" class="card" hidden>
      <p class="prompt">Connect <strong id="start-word"></strong> to <strong id="target-word"></strong></p>
      <p id="par-info"></p>

      <div id="graph-controls">
        <div class="controls-row">
          <label for="threshold-slider">Connection threshold</label>
          <input type="range" id="threshold-slider" min="0" max="1" step="0.01" value="0.50">
          <input type="number" id="threshold-input" min="0" max="1" step="0.01" value="0.50">
        </div>
        <div class="difficulty-group">
          <button type="button" class="btn btn-chip difficulty-btn" data-threshold="0.25">Easy</button>
          <button type="button" class="btn btn-chip difficulty-btn" data-threshold="0.5">Normal</button>
          <button type="button" class="btn btn-chip difficulty-btn" data-threshold="0.7">Hard</button>
        </div>
      </div>

      <svg id="chain-graph" viewBox="0 0 760 380" width="760" height="380"></svg>

      <div class="row">
        <input id="word-input" class="text-input" placeholder="next word">
        <button id="add-word-btn" class="btn btn-primary">Add word</button>
      </div>

      <div class="row actions-row">
        <button id="hint-btn" class="btn btn-outline">Hint</button>
        <button id="give-up-btn" class="btn btn-danger-outline">Give up</button>
        <button id="restart-btn" class="btn btn-outline">Restart</button>
        <button id="new-game-btn" class="btn btn-outline">New game</button>
      </div>

      <p id="score"></p>
      <p id="status"></p>
    </section>
  </main>

  <div id="graph-tooltip" hidden></div>

  <script src="/graph.js"></script>
  <script src="/app.js"></script>
</body>
</html>
